services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resolvegent-backend
    restart: always
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-2.5-32b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - DATABASE_URL=sqlite:///./data/incidents.db
    volumes:
      - incident_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: resolvegent-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  incident_data:
