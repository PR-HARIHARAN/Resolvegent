[project]
name = "incident-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PR-HARIHARAN", email = "prhariharan2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.54",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.53.0",
]

[project.scripts]
incident-engine = "incident_engine:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
